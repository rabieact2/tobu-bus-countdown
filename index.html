<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="data:," />
    <title>東武バス カウントダウン</title>
    <style>
      :root{
        --bg:#edf2f7;
        --card:#ffffff;
        --ink:#17242f;
        --ink-2:#4c6070;
        --ink-3:#7d92a3;
        --line:#dbe4ec;
        --accent:#0e5db8;
        --accent-soft:#e3eefb;
        --warn:#c2410c;
        --warn-soft:#fdf0e7;
        --radius:14px;
      }
      *{box-sizing:border-box;}
      html{-webkit-text-size-adjust:100%;}
      body{
        margin:0;
        background:var(--bg);
        color:var(--ink);
        font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;
        line-height:1.5;
      }
      .wrap{max-width:720px;margin:0 auto;padding:18px 14px 28px;}

      /* ---- 上部：日付とダイヤ種別 ---- */
      .today{
        display:flex;align-items:center;gap:10px;flex-wrap:wrap;
        padding:2px 2px 14px;
      }
      .today .date{font-size:1.06rem;font-weight:700;letter-spacing:.02em;}
      .today .clock{
        margin-left:auto;font-variant-numeric:tabular-nums;
        font-size:1.06rem;font-weight:700;color:var(--ink-2);
      }
      .badge{
        display:inline-flex;align-items:center;min-height:32px;
        padding:3px 12px;border-radius:999px;
        background:var(--accent);color:#fff;
        font-size:.86rem;font-weight:700;letter-spacing:.04em;
      }

      /* ---- 日付指定 ---- */
      .dateselect{
        display:flex;align-items:center;gap:8px;flex-wrap:wrap;
        padding:0 2px 14px;
      }
      .dateselect label{font-size:.88rem;font-weight:700;color:var(--ink-2);}
      .dateselect input[type="date"]{
        font:inherit;font-size:.95rem;font-weight:600;color:var(--ink);
        background:var(--card);border:1px solid var(--line);border-radius:8px;
        padding:6px 10px;min-height:40px;
      }
      .today-btn{
        font:inherit;font-size:.9rem;font-weight:700;cursor:pointer;
        min-height:40px;padding:6px 14px;border-radius:8px;
        background:var(--accent-soft);color:var(--accent);
        border:1px solid #c9dcf5;
      }
      .today-btn:active{background:#d2e4fa;}
      .mode-note{
        margin:0 2px 14px;padding:9px 12px;
        background:var(--warn-soft);color:var(--warn);
        border:1px solid #f3d3bd;border-radius:10px;
        font-size:.9rem;font-weight:700;
      }

      /* ---- 指定日モード（カード内） ---- */
      .sel-info{
        margin-top:8px;font-size:.95rem;font-weight:800;color:var(--accent);
      }
      .sched{margin-top:6px;}
      .card [hidden]{display:none;}

      /* ---- ジャンプナビ ---- */
      .jumpnav{
        position:sticky;top:8px;z-index:30;
        background:var(--card);border:1px solid var(--line);border-radius:12px;
        padding:7px 10px;margin-bottom:14px;
        box-shadow:0 2px 10px rgba(23,50,80,.10);
      }
      .jump-row{
        display:flex;align-items:center;gap:5px;flex-wrap:nowrap;
        overflow-x:auto;-webkit-overflow-scrolling:touch;
        scrollbar-width:none;
      }
      .jump-row + .jump-row{margin-top:5px;}
      .jump-row::-webkit-scrollbar{display:none;}
      .jump-g{
        flex:0 0 auto;font-size:.74rem;font-weight:800;color:#fff;
        background:var(--ink-2);border-radius:999px;
        padding:2px 8px;letter-spacing:.05em;
      }
      .jump-btn{
        flex:0 0 auto;
        font:inherit;font-size:.8rem;font-weight:700;cursor:pointer;
        min-height:34px;padding:4px 10px;border-radius:999px;
        background:var(--accent-soft);color:var(--accent);
        border:1px solid #c9dcf5;white-space:nowrap;
      }
      .jump-btn:active{background:#d2e4fa;}

      /* ---- グループ見出し ---- */
      .group-head{
        display:flex;align-items:baseline;gap:10px;
        margin:20px 2px 10px;
      }
      .group-head:first-of-type{margin-top:2px;}
      .group-head h2{
        margin:0;font-size:1.28rem;font-weight:800;letter-spacing:.06em;
      }
      .group-head .rule{flex:1;height:2px;background:var(--line);border-radius:2px;transform:translateY(-4px);}
      .group-head .count{font-size:.82rem;color:var(--ink-3);font-weight:600;}

      /* ---- カード ---- */
      .card{
        background:var(--card);
        border:1px solid var(--line);
        border-radius:var(--radius);
        padding:16px 16px 14px;
        margin-bottom:12px;
        box-shadow:0 1px 3px rgba(23,50,80,.06);
      }
      .stop-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
      .stop-name{font-size:1.45rem;font-weight:800;letter-spacing:.02em;margin:0;}
      .stop-sub{font-size:.88rem;color:var(--ink-2);font-weight:600;}

      .countdown{
        margin-top:10px;
        font-size:2.35rem;font-weight:800;letter-spacing:.01em;
        font-variant-numeric:tabular-nums;line-height:1.15;color:var(--accent);
      }
      .countdown.urgent{color:var(--warn);}
      .countdown.ended{color:var(--ink-2);font-size:1.5rem;padding:6px 0 2px;}

      .next-bus{
        margin-top:4px;font-size:1.02rem;font-weight:700;
      }
      .next-bus .dest{color:var(--accent);}
      .next-bus .tomorrow{color:var(--ink-2);font-weight:600;font-size:.93rem;}

      .upcoming{
        list-style:none;margin:12px 0 0;padding:10px 0 0;
        border-top:1px solid var(--line);
      }
      .upcoming li{
        display:flex;align-items:baseline;gap:10px;
        padding:6px 0;font-size:.98rem;
      }
      .upcoming li + li{border-top:1px dashed var(--line);}
      .upcoming .t{font-weight:800;font-variant-numeric:tabular-nums;min-width:3.4em;}
      .upcoming .d{color:var(--ink-2);font-weight:600;}
      .upcoming .in{
        margin-left:auto;font-size:.82rem;color:var(--ink-3);
        font-variant-numeric:tabular-nums;white-space:nowrap;
      }
      .upcoming .label{
        font-size:.78rem;font-weight:700;color:var(--ink-3);letter-spacing:.05em;
        padding-top:2px;
      }

      /* ---- 時刻表トグル ---- */
      .tt-toggle{
        margin-top:12px;width:100%;
        display:flex;align-items:center;justify-content:center;gap:8px;
        min-height:44px;padding:10px 14px;
        background:var(--accent-soft);color:var(--accent);
        border:1px solid #c9dcf5;border-radius:10px;
        font:inherit;font-size:.95rem;font-weight:700;cursor:pointer;
      }
      .tt-toggle:active{background:#d2e4fa;}
      .tt-toggle .chev{transition:transform .18s ease;font-size:.8rem;}
      .tt-toggle[aria-expanded="true"] .chev{transform:rotate(180deg);}

      .tt-panel{margin-top:12px;}
      .tt-panel[hidden]{display:none;}
      .tt-note{font-size:.8rem;color:var(--ink-3);margin:0 0 8px;}
      .tt-hour{
        display:flex;gap:10px;padding:7px 0;
        border-top:1px solid var(--line);
      }
      .tt-hour:first-of-type{border-top:none;}
      .tt-h{
        flex:0 0 2.6em;font-weight:800;font-variant-numeric:tabular-nums;
        color:var(--ink-2);padding-top:2px;
      }
      .tt-mins{display:flex;flex-wrap:wrap;gap:6px;}
      .tt-chip{
        display:inline-flex;align-items:baseline;gap:5px;
        background:#f2f6fa;border:1px solid var(--line);border-radius:8px;
        padding:4px 8px;font-size:.85rem;
      }
      .tt-chip b{font-variant-numeric:tabular-nums;font-weight:800;}
      .tt-chip span{color:var(--ink-2);font-size:.78rem;font-weight:600;}
      .tt-chip.past{opacity:.38;}

      /* ---- 高速バッジ ---- */
      .hw-badge{
        display:inline-block;vertical-align:middle;
        background:#ffffff;color:#054d26;
        border:2px solid #054d26;
        border-radius:999px;padding:2px 10px;margin-left:5px;
        font-size:.84rem;font-weight:800;letter-spacing:.1em;
        white-space:nowrap;line-height:1.55;
      }
      .upcoming .hw-badge{margin-left:2px;}

      footer{
        margin-top:22px;padding:12px 4px 0;
        border-top:1px solid var(--line);
        font-size:.78rem;color:var(--ink-3);line-height:1.7;
      }
      @media (max-width:420px){
        .countdown{font-size:2.05rem;}
        .stop-name{font-size:1.32rem;}
      }
    </style>
  </head>

    <div class="wrap">
      <div class="today">
        <span class="date" id="todayDate">—</span>
        <span class="badge" id="dayTypeBadge">—</span>

      </div>

      <div class="dateselect">
        <label for="dateInput">日付を指定</label>
        <input type="date" id="dateInput" />
        <button type="button" class="today-btn" id="todayBtn" hidden>今日に戻す</button>
      </div>
      <p class="mode-note" id="modeNote" hidden></p>

      <nav class="jumpnav" id="jumpNav" aria-label="バス停へのジャンプ"></nav>

      <main id="board"></main>

      </footer>
    </div>

      /* 曜日種別: "w"=平日 "s"=土曜 "h"=休日 */

          var t2 = dayType(tomorrow);
          var first = card.times[t2][0];
          refs.countdown.textContent = "本日の運行は終了";
          refs.countdown.className = "countdown ended";
          if (first) {
            refs.nextBus.innerHTML =
              "<span class=\"tomorrow\">翌日の始発：明日 " +
              (tomorrow.getMonth() + 1) + "月" + tomorrow.getDate() + "日（" + WEEKDAYS[tomorrow.getDay()] + "・" + dayTypeLabel(t2) + "） " +
              fmtTime(first.m) + "発 " + destHtml(card.dests[first.d]) + "行き</span>";
          } else {
            refs.nextBus.innerHTML = "";
          }
          refs.upcoming.innerHTML = "";
          return;
        }

        var next = upcoming[0];
        var diff = next.when.getTime() - now.getTime();
        refs.countdown.textContent = fmtCountdown(diff);
        refs.countdown.className = "countdown" + (diff <= 5 * 60 * 1000 ? " urgent" : "");
        refs.nextBus.innerHTML =
          "次のバス " + fmtTime(next.e.m) + "発 <span class=\"dest\">" + destHtml(card.dests[next.e.d]) + "行き</span>";

        var html = "";
        if (upcoming.length > 1) {
          html += "<li class=\"label\">その後のバス</li>";
          for (var j = 1; j < upcoming.length; j++) {
            var u = upcoming[j];
            html += "<li><span class=\"t\">" + fmtTime(u.e.m) + "</span>" +
                    "<span class=\"d\">" + destHtml(card.dests[u.e.d]) + "行き</span>" +
                    "<span class=\"in\">" + fmtIn(u.when.getTime() - now.getTime()) + "</span></li>";
          }
        }
        refs.upcoming.innerHTML = html;
      }

      function buildTimetableNeeded(refs, now){
        return refs.builtFor !== (dateKey(now) + ":" + dayType(now));
      }

      /* ---- 日付指定モード ---- */
      var viewDate = null; /* null = 今日（カウントダウン表示） */
      var dateInput = document.getElementById("dateInput");
      var todayBtn = document.getElementById("todayBtn");
      var modeNote = document.getElementById("modeNote");

      function fmtDateLong(d){
        return d.getFullYear() + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日（" + WEEKDAYS[d.getDay()] + "）";
      }
      function fmtDateShort(d){
        return (d.getMonth() + 1) + "月" + d.getDate() + "日（" + WEEKDAYS[d.getDay()] + "）";
      }

      function renderSched(refs, d){
        var card = refs.card;
        var t = dayType(d);
        var list = card.times[t];
        var byHour = {};
        list.forEach(function(e){
          var h = Math.floor(e.m / 60);
          if (!byHour[h]) byHour[h] = [];
          byHour[h].push(e);
        });
        var html = "<p class=\"tt-note\">全" + list.length + "本</p>";
        Object.keys(byHour).sort(function(a,b){ return a - b; }).forEach(function(h){
          html += "<div class=\"tt-hour\"><div class=\"tt-h\">" + h + "時</div><div class=\"tt-mins\">";
          byHour[h].forEach(function(e){
            html += "<span class=\"tt-chip\"><b>" + fmtTime(e.m) + "</b><span>" + destHtml(card.dests[e.d]) + "行き</span></span>";
          });
          html += "</div></div>";
        });
        refs.sched.innerHTML = html;
        refs.schedFor = dateKey(d) + ":" + t;
      }

      function applyMode(){
        var now = new Date();
        var dateMode = viewDate !== null;
        todayBtn.hidden = !dateMode;
        modeNote.hidden = !dateMode;
        if (dateMode) {
          document.getElementById("todayDate").textContent = fmtDateLong(viewDate);
          document.getElementById("dayTypeBadge").textContent = dayTypeLabel(dayType(viewDate));
          modeNote.textContent = fmtDateShort(viewDate) + "の時刻表を表示中です（カウントダウンは今日のみ）";
        } else {
          document.getElementById("todayDate").textContent = fmtDateLong(now);
          document.getElementById("dayTypeBadge").textContent = dayTypeLabel(dayType(now));
          lastDateKey = dateKey(now);
        }
        cardEls.forEach(function(refs){
          refs.selInfo.hidden = !dateMode;
          refs.sched.hidden = !dateMode;
          refs.countdown.hidden = dateMode;
          refs.nextBus.hidden = dateMode;
          refs.upcoming.hidden = dateMode;
          refs.toggle.hidden = dateMode;
          if (dateMode) {
            refs.panel.setAttribute("hidden", "");
            refs.toggle.setAttribute("aria-expanded", "false");
            refs.toggle.firstChild.textContent = "時刻表を見る ";
            refs.selInfo.textContent = fmtDateShort(viewDate) + "・" + dayTypeLabel(dayType(viewDate));
            if (refs.schedFor !== dateKey(viewDate) + ":" + dayType(viewDate)) renderSched(refs, viewDate);
          }
        });
      }

      dateInput.addEventListener("change", function(){
        var v = dateInput.value;
        if (!v) return;
        var a = v.split("-");
        var d = new Date(parseInt(a[0], 10), parseInt(a[1], 10) - 1, parseInt(a[2], 10));
        if (isNaN(d.getTime())) return;
        viewDate = (dateKey(d) === dateKey(new Date())) ? null : d;
        applyMode();
        if (!viewDate) tick();
      });

      todayBtn.addEventListener("click", function(){
        viewDate = null;
        dateInput.value = dateKey(new Date());
        applyMode();
        tick();
      });

      var lastDateKey = "";
      function tick(){
        var now = new Date();
        document.getElementById("clock").textContent =
          pad2(now.getHours()) + ":" + pad2(now.getMinutes()) + ":" + pad2(now.getSeconds());
        /* 指定していた日が今日になったらカウントダウン表示へ戻す */
        if (viewDate && dateKey(viewDate) === dateKey(now)) {
          viewDate = null;
          dateInput.value = dateKey(now);
          applyMode();
        }
        if (viewDate) return;
        var key = dateKey(now);
        if (key !== lastDateKey) {
          lastDateKey = key;
          document.getElementById("todayDate").textContent =
            now.getFullYear() + "年" + (now.getMonth() + 1) + "月" + now.getDate() + "日（" + WEEKDAYS[now.getDay()] + "）";
          document.getElementById("dayTypeBadge").textContent = dayTypeLabel(dayType(now));
          cardEls.forEach(function(refs){ refs.builtFor = ""; });
        }
        cardEls.forEach(function(refs){ updateCard(refs, now); });
      }

      buildBoard();
      buildNav();
      dateInput.value = dateKey(new Date());
      tick();
      setInterval(tick, 1000);
    </script>
  </body>
</html>
